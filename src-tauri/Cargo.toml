[package]
name = "soly-auto-clicker"
version = "1.0.0"
description = "A portable keyboard and mouse auto clicker"
authors = ["Professor Soly", "Codex"]
edition = "2021"

[lib]
name = "soly_auto_clicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
